name: Release

on:
  push:
    tags:
      - '*'

jobs:
  create-push-image-windows-2022:
    runs-on: windows-2022
    env:
      REPO: rancher
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: retrieve dockerhub credentials
        uses: rancher-eio/read-vault-secrets@0da85151ad1f19ed7986c41587e45aac1ace74b6 # v3
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/dockerhub/rancher/credentials username | DOCKER_USERNAME ;
            secret/data/github/repo/${{ github.repository }}/dockerhub/rancher/credentials password | DOCKER_PASSWORD

      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'
          cache: 'false'

      - name: Install Dependencies
        run: |
          go install github.com/magefile/mage@69e6f824732575e57977f68f8f3dd78313d666e5 # v1.16
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@c0d3ddc9cf3faa61a4e378e879ece580256d76e5 # v2.12.2

      # added a start docker service step to ensure that the docker service is running before running the e2e tests
      - name: Start Docker Service
        id: start-docker-service
        run: |
          $dockerSvc = Get-Service -Name "docker"
          if ($dockerSvc.Status -ne "Running") {
            Start-Service -Name "docker"
          }

      - name: build-binary
        run: |
          set PSModulePath=&&powershell -command "mage ci"

      # Note: We cannot use the docker/build-push-action as it requires dependencies
      # which cannot be installed onto windows VMs. Additionally, it is not possible to cross compile
      # Windows images on linux. So, we're stuck with manual docker commands.
      - name: Build Windows 2022
        run: ./scripts/build-image.ps1 -NanoServerVersion "ltsc2022" -Repo "${{ env.REPO }}" -Tag "${{ env.TAG }}"

      - name: push images
        run: |
          docker push ${{ env.REPO }}/wins:${{ env.TAG }}-windows-ltsc2022

  create-push-image-windows-2019-using-2025:
    runs-on: windows-2025
    env:
      REPO: rancher
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: retrieve dockerhub credentials
        uses: rancher-eio/read-vault-secrets@0da85151ad1f19ed7986c41587e45aac1ace74b6 # v3
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/dockerhub/rancher/credentials username | DOCKER_USERNAME ;
            secret/data/github/repo/${{ github.repository }}/dockerhub/rancher/credentials password | DOCKER_PASSWORD

      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      # This step is required otherwise the 'mage'
      # command cannot be used in subsequent steps
      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'
          cache: 'false'

      - name: Install Dependencies
        run: |
          go install github.com/magefile/mage@69e6f824732575e57977f68f8f3dd78313d666e5 # v1.16
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@c0d3ddc9cf3faa61a4e378e879ece580256d76e5 # v2.12.2

      # added a start docker service step to ensure that the docker service is running before running the e2e tests
      - name: Start Docker Service
        id: start-docker-service
        run: |
          $dockerSvc = Get-Service -Name "docker"
          if ($dockerSvc.Status -ne "Running") {
            Start-Service -Name "docker"
          }

      - name: build-binary
        run: |
          set PSModulePath=&&powershell -command "mage ci"

      # Note: We cannot use the docker/build-push-action as it requires dependencies
      # which cannot be installed onto windows VMs. Additionally, it is not possible to cross compile
      # Windows images on linux. So, we're stuck with manual docker commands.
      - name: Build Windows 2019
        run: ./scripts/build-image.ps1 -NanoServerVersion "ltsc2019" -Repo "${{ env.REPO }}" -Tag "${{ env.TAG }}"

      - name: push images
        run: |
          docker push ${{ env.REPO }}/wins:${{ env.TAG }}-windows-ltsc2019

  create-draft:
    runs-on: ubuntu-latest
    needs:
    - create-push-image-windows-2022
    - create-push-image-windows-2019-using-2025
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create -R "${GITHUB_REPOSITORY}" --draft --generate-notes "${GITHUB_REF_NAME}"

  build-binaries:
    needs: [ create-draft, create-push-image-windows-2019-using-2025, create-push-image-windows-2022 ]
    runs-on: windows-2022
    permissions:
      contents: write # required for writing release artifacts
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'

      - name: Install Dependencies
        run: |
          go install github.com/magefile/mage@69e6f824732575e57977f68f8f3dd78313d666e5 # v1.16
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@c0d3ddc9cf3faa61a4e378e879ece580256d76e5 # v2.12.2

      - name: build-binary
        run: |
          set PSModulePath=&&powershell -command "mage buildAll"

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifacts
          path: |
            artifacts/wins.exe
            artifacts/sha256.txt
            artifacts/sha512.txt
            artifacts/install.ps1
            artifacts/uninstall.ps1
            LICENSE
          if-no-files-found: error

  build-csi-proxy:
    name: Build CSI Proxy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CSI_PROXY_VERSION: v1.1.3
      # commit that CSI_PROXY_VERSION points to, pinned so the checkout cannot silently change
      CSI_PROXY_COMMIT: 0211feaf25cd165167e86dda8d2782876647d257
    steps:
      - name: Checkout kubernetes-csi/csi-proxy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: kubernetes-csi/csi-proxy
          ref: ${{ env.CSI_PROXY_COMMIT }}
          path: csi-proxy

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 'stable'
          cache: 'false'

      # Upstream's Makefile cross-compiles bin/csi-proxy.exe for windows/amd64
      - name: Build csi-proxy binary
        working-directory: csi-proxy
        run: make build

      - name: Stage csi-proxy artifacts
        working-directory: csi-proxy
        run: |
          set -euo pipefail
          name="csi-proxy-${CSI_PROXY_VERSION}.exe"
          mv bin/csi-proxy.exe "../${name}"
          cd ..
          sha256sum "${name}" > "${name}.sha256"
          sha512sum "${name}" > "${name}.sha512"
          ls -l csi-proxy-*

      - name: Upload csi-proxy artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: csi-proxy-artifacts
          path: |
            csi-proxy-*.exe
            csi-proxy-*.exe.sha256
            csi-proxy-*.exe.sha512
          if-no-files-found: error

  create-manifest:
    needs: [ create-push-image-windows-2019-using-2025, create-push-image-windows-2022 ]
    permissions:
      id-token: write
    env:
      REPO: rancher
      TAG: ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: retrieve dockerhub credentials
        uses: rancher-eio/read-vault-secrets@0da85151ad1f19ed7986c41587e45aac1ace74b6 # v3
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/dockerhub/rancher/credentials username | DOCKER_USERNAME ;
            secret/data/github/repo/${{ github.repository }}/dockerhub/rancher/credentials password | DOCKER_PASSWORD

      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: create manifest list
        run: |
          docker manifest create ${{ env.REPO }}/wins:${{ env.TAG }} ${{ env.REPO }}/wins:${{ env.TAG }}-windows-ltsc2022 ${{ env.REPO }}/wins:${{ env.TAG }}-windows-ltsc2019
          docker manifest push ${{ env.REPO }}/wins:${{ env.TAG }}

  finalize-github-release:
    name: Publish GitHub release
    needs: [ build-binaries, build-csi-proxy, create-manifest ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-artifacts
          path: /tmp/assets

      - name: Download csi-proxy artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: csi-proxy-artifacts
          path: /tmp/csi-proxy

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload -R "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" /tmp/assets/artifacts/* /tmp/assets/LICENSE /tmp/csi-proxy/*

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS="--draft=false"
          if [[ "${GITHUB_REF_NAME}" == *"-rc"* ]]; then
            FLAGS="${FLAGS} --prerelease"
          fi
          gh release edit -R "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" ${FLAGS}
