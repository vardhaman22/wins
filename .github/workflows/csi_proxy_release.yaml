name: Release CSI Proxy Test

on:
  push:
    tags:
      - 'test-*'

jobs:
  create-draft:
    name: Create draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create -R "${GITHUB_REPOSITORY}" --draft --generate-notes "${GITHUB_REF_NAME}"

  build-csi-proxy:
    name: Build CSI Proxy
    needs: [ create-draft ]
    runs-on: windows-2022
    permissions:
      contents: read
    env:
      CSI_PROXY_VERSION: v1.1.3
      # commit that CSI_PROXY_VERSION points to, pinned so the checkout cannot silently change
      CSI_PROXY_COMMIT: 0211feaf25cd165167e86dda8d2782876647d257
    steps:
      - name: Checkout kubernetes-csi/csi-proxy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: kubernetes-csi/csi-proxy
          ref: ${{ env.CSI_PROXY_COMMIT }}
          path: csi-proxy

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'csi-proxy/go.mod'
          cache: 'false'

      # Upstream's Makefile cross-compiles bin/csi-proxy.exe for windows/amd64
      - name: Build csi-proxy binary
        working-directory: csi-proxy
        run: make build

      - name: Stage csi-proxy artifacts
        working-directory: csi-proxy
        run: |
          set -euo pipefail
          name="csi-proxy-${CSI_PROXY_VERSION}.exe"
          mv bin/csi-proxy.exe "../${name}"
          cd ..
          sha256sum "${name}" > "${name}.sha256"
          sha512sum "${name}" > "${name}.sha512"
          ls -l csi-proxy-*

      - name: Upload csi-proxy artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: csi-proxy-artifacts
          path: |
            csi-proxy-*.exe
            csi-proxy-*.exe.sha256
            csi-proxy-*.exe.sha512
          if-no-files-found: error

  finalize-github-release:
    name: Upload assets and publish release
    needs: [ build-csi-proxy ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download csi-proxy artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: csi-proxy-artifacts
          path: /tmp/csi-proxy

      - name: Upload csi-proxy artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload -R "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" /tmp/csi-proxy/*

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS="--draft=false"
          if [[ "${GITHUB_REF_NAME}" == *"-rc"* ]]; then
            FLAGS="${FLAGS} --prerelease"
          fi
          gh release edit -R "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" ${FLAGS}