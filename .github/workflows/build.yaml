name: Build Windows artifacts

on:
  workflow_call:
    inputs:
      tag:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rancher/ci-image/go1.26
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install mage
        run: |
          go install github.com/magefile/mage@69e6f824732575e57977f68f8f3dd78313d666e5 # v1.16
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build and validate with AppCo Go
        run: mage buildAll

      - name: Upload Windows build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-build
          path: |
            artifacts/
            bin/
            tests/integration/bin/test_service.exe
            suc/pkg/host/wins.exe
          if-no-files-found: error

      - name: Upload release artifacts
        if: inputs.tag != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifacts
          path: |
            artifacts/wins.exe
            artifacts/sha256.txt
            artifacts/sha512.txt
            artifacts/install.ps1
            artifacts/uninstall.ps1
            LICENSE
          if-no-files-found: error
